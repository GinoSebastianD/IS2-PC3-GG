name: Construccion Maven

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar, probar e instalar
        run: ./mvnw -B -ntp clean install
      - name: Ejecutar el JAR
        run: java -jar target/calculadora-notas-1.0.0.jar 14 16 18
      - name: Conservar el JAR y los resultados
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-notas
          path: |
            target/calculadora-notas-1.0.0.jar
            target/surefire-reports/
